<style>
@property --p{syntax:'<number>';inherits:true;initial-value:0}
:root{--u:min(1vw,15.4px);--ink:#0a1626;--sun:#ffc94a;--teal:#0e6e86;--mist:#b9cde0;--line:#d3dee7;--bg:#eef3f7}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}.wrap{max-width:1120px;margin:0 auto;padding:0 22px;position:relative}
/* hero */
.hero{position:relative;overflow:hidden;color:#fff;background:
  radial-gradient(55% 60% at 6% 0%,rgba(14,110,134,.9),transparent 70%),
  radial-gradient(45% 55% at 100% 70%,rgba(194,84,26,.6),transparent 70%),
  radial-gradient(40% 50% at 0% 90%,rgba(106,53,232,.45),transparent 70%),
  linear-gradient(180deg,#0a1626 0%,#0d1f35 100%)}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1.2px,transparent 1.2px);background-size:26px 26px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%);pointer-events:none}
.hero:after{content:"";position:absolute;left:50%;bottom:-6vw;width:96vw;height:44vw;margin-left:-48vw;background:radial-gradient(closest-side,rgba(255,190,70,.38),transparent 72%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0 0}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:22px;letter-spacing:-.02em;color:#fff;text-decoration:none;white-space:nowrap}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--sun);display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;left:8px;top:8px;width:18px;height:18px;border:4px solid var(--ink);border-radius:5px;transform:rotate(45deg) scale(.7)}
.call{display:inline-flex;align-items:center;gap:9px;background:#fff;color:var(--ink);font-weight:800;font-size:16px;padding:11px 18px;border-radius:12px;text-decoration:none;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .15s}
.call:hover{transform:translateY(-1px)}.call svg{width:17px;height:17px;color:#0e6e86}.call .num{color:#46606f;font-weight:700}
.headline{text-align:center;padding:clamp(18px,3vw,40px) 0 0}
h1{font-size:clamp(40px,6vw,84px);line-height:.98;letter-spacing:-.04em;word-spacing:.08em;margin:0;font-weight:800}
h1 span{background:linear-gradient(90deg,#ffd45c,#ff9f3a);-webkit-background-clip:text;background-clip:text;color:transparent}
/* fan */
.fan{--shift:calc(var(--u)*2.2);--w:calc(var(--u)*19.5);--dx:calc(var(--u)*6.15);--dy:calc(var(--u)*.3);--a:3.6deg;--lift:calc(var(--u)*4);
  position:relative;height:calc(var(--w)*1.46);margin-top:clamp(14px,2vw,28px);overflow:hidden;transition:--p 1.3s cubic-bezier(.2,.9,.25,1);--p:0}
.fan.go{--p:1}
.fan:before{content:"";position:absolute;left:50%;bottom:calc(var(--u)*-23);width:calc(var(--u)*49);height:calc(var(--u)*49);margin-left:calc(var(--u)*-24.5);border-radius:50%;background:radial-gradient(circle at 50% 30%,#ffe17f 0%,#ffc94a 45%,#ff9f3a 100%)}
.c{position:absolute;bottom:0;left:50%;width:var(--w);margin-left:calc(var(--w)/-2);border-radius:calc(var(--u)*1.4) calc(var(--u)*1.4) 0 0;background:#fff;
  box-shadow:0 18px 44px rgba(3,10,22,.5),0 0 0 1px rgba(255,255,255,.08);transform-origin:50% 115%;
  transform:translateX(calc(var(--i)*var(--dx)*var(--p) + var(--shift,0px)*var(--p))) translateY(calc(var(--i)*var(--i)*var(--dy)*var(--p) + var(--lift))) rotate(calc(var(--i)*var(--a)*var(--p)));
  transition:translate .25s ease}
.c:hover{translate:0 calc(var(--u)*-1.8)}
.build{position:absolute;left:50%;bottom:calc(var(--u)*5);z-index:40;transform:translateX(-50%);display:inline-flex;align-items:center;gap:12px;background:var(--sun);color:var(--ink);font:inherit;font-weight:800;font-size:clamp(18px,1.6vw,22px);padding:18px 34px;border-radius:16px;text-decoration:none;white-space:nowrap;
  box-shadow:0 0 0 6px rgba(10,22,38,.85),0 20px 50px rgba(0,0,0,.55);transition:transform .15s,box-shadow .15s}
.build:hover{transform:translateX(-50%) translateY(-2px)}
.build svg{width:22px;height:22px}
@media(max-width:700px){
  :root{--u:1vw}
  .call .num{display:none}
  h1{font-size:clamp(34px,10.4vw,46px)}
  .fan{--shift:0px;--w:calc(var(--u)*34);--dx:calc(var(--u)*11.8);--dy:calc(var(--u)*.8);--a:6deg;--lift:calc(var(--u)*5);height:calc(var(--w)*1.55)}
  .c.far{display:none}
  .fan:before{width:calc(var(--u)*80);height:calc(var(--u)*80);margin-left:calc(var(--u)*-40);bottom:calc(var(--u)*-30)}
  .build{padding:15px 26px;bottom:calc(var(--u)*7)}
  .promise .wrap{gap:10px 22px;padding-top:16px;padding-bottom:16px}.promise div{font-size:15px}.promise svg{width:22px;height:22px}
}
@media(prefers-reduced-motion:reduce){.fan{transition:none;--p:1}.c,.build,.call{transition:none}}
/* promise row */
.promise{background:#fff;border-bottom:1px solid var(--line)}
.promise .wrap{display:flex;justify-content:center;gap:clamp(18px,5vw,64px);flex-wrap:wrap;padding-top:22px;padding-bottom:22px}
.promise div{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(15px,1.5vw,18px);letter-spacing:-.01em;white-space:nowrap}
.promise svg{width:26px;height:26px;color:var(--teal);flex:none}
/* form */
#request{padding:clamp(48px,7vw,88px) 0}
.formcard{max-width:680px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(22px,4vw,44px);box-shadow:0 30px 70px rgba(10,22,38,.12)}
.formcard h2{font-size:clamp(30px,4vw,44px);line-height:1.05;letter-spacing:-.035em;margin:0 0 24px;font-weight:800;text-align:center}
form{display:grid;gap:16px}.row{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:640px){.row{grid-template-columns:1fr}}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px;color:#2a4150}
input[type=text],input[type=tel],input[type=email],input:not([type]){width:100%;font:inherit;font-size:16.5px;font-weight:500;padding:13px 14px;border:1.5px solid #c4d3de;border-radius:12px;background:#fbfdfe;color:var(--ink);min-height:52px;transition:border-color .15s,box-shadow .15s,background .15s}
input:hover{border-color:#9db6c6}
input:focus{outline:0;border-color:var(--teal);background:#fff;box-shadow:0 0 0 4px rgba(14,110,134,.16)}
.req{color:#c0392b}
.drop{position:relative;display:flex;align-items:center;gap:14px;border:1.5px dashed #9db6c6;border-radius:14px;padding:14px 16px;background:#f6fafc;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--teal);background:#eef7fa}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.thumb{width:52px;height:52px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden}
.thumb svg{width:24px;height:24px;color:var(--teal)}.thumb img{width:100%;height:100%;object-fit:contain;display:none}
.drop.has .thumb img{display:block}.drop.has .thumb svg{display:none}
#droptext b{display:block;font-weight:800;font-size:15.5px;word-break:break-all}#droptext span{display:block;font-size:13.5px;color:#5f7686;font-weight:500}
.clear{position:relative;z-index:2;margin-left:auto;display:none;background:none;border:0;color:#8a1c14;font:inherit;font-weight:700;font-size:14px;cursor:pointer;padding:6px}
.drop.has .clear{display:block}
.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
.send{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:19px;padding:18px 28px;border:0;border-radius:14px;cursor:pointer;margin-top:4px;transition:background .15s,transform .15s}
.send b{color:var(--sun)}.send:hover{background:#13304d;transform:translateY(-1px)}.send:disabled{opacity:.65;cursor:wait;transform:none}
.msg{border-radius:14px;padding:14px 16px;font-weight:700;display:none}
.msg.ok{display:block;background:#e6f6ee;color:#0b5a3a;border:1.5px solid #a5dcc0}
.msg.err{display:block;background:#fdebe8;color:#8a1c14;border:1.5px solid #f2b9b2}
/* jobs */
.jobs{background:var(--ink);color:#fff;padding:clamp(52px,7vw,84px) 0 clamp(44px,6vw,64px);position:relative;overflow:hidden}
.jobs:before{content:"";position:absolute;right:-12vw;top:-14vw;width:42vw;height:42vw;border-radius:50%;background:radial-gradient(circle,rgba(14,110,134,.55),transparent 65%)}
.jobs h2{font-size:clamp(30px,4.4vw,48px);line-height:1.05;letter-spacing:-.035em;word-spacing:.06em;margin:0 0 26px;font-weight:800;position:relative}.jobs h2 span{color:var(--sun)}
.joblist{position:relative;columns:3 260px;column-gap:36px;max-height:430px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.joblist.open{max-height:none;-webkit-mask-image:none;mask-image:none}
.group{break-inside:avoid;margin:0 0 26px}
.group h3{margin:0 0 8px;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sun);font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:2px 0}
.tag{font:inherit;font-weight:600;font-size:15.5px;background:none;border:0;color:var(--mist);padding:3px 0;cursor:pointer;margin-right:14px;text-align:left}
.tag:hover,.tag:focus-visible{color:#fff;text-decoration:underline;text-decoration-color:var(--sun);text-underline-offset:4px;outline:0}
.tog{position:relative;margin-top:18px;background:none;color:var(--sun);border:1.5px solid rgba(255,201,74,.55);font:inherit;font-weight:800;font-size:16px;padding:12px 22px;border-radius:12px;cursor:pointer}
.tog:hover{background:rgba(255,201,74,.12)}
footer{background:#07101c;color:var(--mist);padding:26px 0;font-weight:500;font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;align-items:center}
footer a{color:#fff;font-weight:700}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
</style>
</head>
